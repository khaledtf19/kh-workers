name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Tests use #[sqlx::test], which creates and drops its own databases.
  DATABASE_URL: postgres://kh:kh@localhost:5432/kh_workers

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: kh
          POSTGRES_PASSWORD: kh
          POSTGRES_DB: kh_workers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kh -d kh_workers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace
