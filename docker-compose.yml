services:
  postgres:
    image: postgres:19
    environment:
      POSTGRES_USER: kh
      POSTGRES_PASSWORD: kh
      POSTGRES_DB: kh_workers
    ports:
      # 5433 on the host: 5432 is commonly taken by a local Postgres.
      - "5433:5432"
    volumes:
      # PostgreSQL 18+ images store data in /var/lib/postgresql/<major>/docker,
      # so the volume must be mounted one level above the data directory.
      # Mounting /var/lib/postgresql/data makes 18+ images refuse to start.
      - postgres-data-19:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kh -d kh_workers"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  # New volume for the PostgreSQL 19 data layout. The previous postgres-data
  # volume (written by PostgreSQL 17) is left untouched; remove it manually
  # once you no longer need its contents.
  postgres-data-19:
